name: BSC English build

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Fetch archived English BSC 0.1.98.4
        shell: bash
        run: |
          rm -rf /tmp/bsc-archive
          git init /tmp/bsc-archive
          git -C /tmp/bsc-archive remote add origin https://github.com/puffingprie/starsector-modlist.git
          git -C /tmp/bsc-archive sparse-checkout init --cone
          git -C /tmp/bsc-archive sparse-checkout set 'BigBeans Ship Compilation'
          git -C /tmp/bsc-archive fetch --depth 1 --filter=blob:none origin 38d0d7fd4b9e4100022c1fd32783c06d593536ec
          git -C /tmp/bsc-archive checkout --detach FETCH_HEAD

      - name: Build English-facing 0.1.98.7
        shell: bash
        run: |
          python3 tools/build_english_01987.py . '/tmp/bsc-archive/BigBeans Ship Compilation'

      - name: Verify save-critical files remain
        shell: bash
        run: |
          test -f 'BSC 0.1.98.7 English/data/hulls/BSC_Buffalo_Mk3.ship'
          test -f 'BSC 0.1.98.7 English/data/variants/BSC_Buffalo_Mk3_Standard.variant'
          grep -q '"version"[[:space:]]*:[[:space:]]*"0.1.98.7"' 'BSC 0.1.98.7 English/mod_info.json'

      - name: Commit generated build and report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'BSC 0.1.98.7 English' analysis/bsc_english_build_report.json
          git commit -m 'Generate English-facing BSC 0.1.98.7' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
